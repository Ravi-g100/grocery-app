

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3>Checkout</h3>

                </div>

                <div class="card-body">

                    <form
                        [formGroup]="checkoutForm"
                        (ngSubmit)="placeOrder()">

                        <div class="mb-3">

                            <label>Full Name</label>

                            <input
                                class="form-control"
                                formControlName="fullname">

                        </div>

                        <div class="mb-3">

                            <label>Mobile</label>

                            <input
                                class="form-control"
                                formControlName="mobile">

                        </div>

                        <div class="mb-3">

                            <label>Address</label>

                            <textarea
                                class="form-control"
                                rows="3"
                                formControlName="address">
                            </textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <label>City</label>

                                <input
                                    class="form-control"
                                    formControlName="city">

                            </div>

                            <div class="col-md-6">

                                <label>Pincode</label>

                                <input
                                    class="form-control"
                                    formControlName="pincode">

                            </div>

                        </div>

                        <div class="mt-3">

                            <label>Payment Method</label>

                            <select
                                class="form-select"
                                formControlName="payment">

                                <option value="COD">
                                    Cash On Delivery
                                </option>

                                <option value="UPI">
                                    UPI
                                </option>

                                <option value="CARD">
                                    Debit / Credit Card
                                </option>

                            </select>

                        </div>

                        <button
                            class="btn btn-success w-100 mt-4">

                            Place Order

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
