<div class="container mt-5">

    <div class="row">

        <div class="col-md-5">

            <img
                [src]="product.image"
                class="img-fluid">

        </div>

        <div class="col-md-7">

            <h2>

                {{product.name}}

            </h2>

            <h4 class="text-success">

                ₹{{product.price}}

            </h4>

            <p>

                Category :
                <b>{{product.category}}</b>

            </p>

            <p>

                Stock :
                {{product.stock}}

            </p>

            <button
                class="btn btn-success btn-lg"
                (click)="addToCart()">

                Add To Cart

            </button>

        </div>

    </div>

</div>
