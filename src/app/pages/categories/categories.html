<div class="container py-4">

  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <div class="text-center mb-5">

    <h2 class="fw-bold">
      📂 Grocery Categories
    </h2>

    <p class="text-muted">
      Explore our grocery categories
    </p>

  </div>


  <!-- ========================= -->
  <!-- CATEGORIES -->
  <!-- ========================= -->

  <div class="row g-4">

    @for (
      category of categories;
      track category
    ) {

      <div
        class="col-lg-3 col-md-4 col-sm-6">

        <div
          class="card shadow-sm h-100 text-center">


          <!-- ========================= -->
          <!-- IMAGE -->
          <!-- ========================= -->

          <img
            [src]="getCategoryImage(category)"
            [alt]="category"
            class="card-img-top p-3"
            style="
              height:180px;
              object-fit:contain;
            ">


          <!-- ========================= -->
          <!-- BODY -->
          <!-- ========================= -->

          <div
            class="card-body d-flex flex-column">

            <h5
              class="card-title mb-3">

              {{ category }}

            </h5>


            <!-- ========================= -->
            <!-- VIEW PRODUCTS -->
            <!-- ========================= -->

            <a
              [routerLink]="['/products']"
              [queryParams]="{
                category: category
              }"
              class="btn btn-success mt-auto">

              🛒 View Products

            </a>

          </div>

        </div>

      </div>

    }

  </div>

</div>
